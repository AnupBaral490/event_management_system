{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="glass-card p-4">
      <h3 class="mb-3">Login</h3>
      <p class="text-secondary">Access your attendee, organizer, or admin dashboard.</p>
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary-brand w-100" type="submit">Login</button>
      </form>
      <div class="mt-3 d-flex justify-content-between">
        <a href="/accounts/password_reset/">Forgot password?</a>
        <a href="/accounts/register-page/">Create account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
