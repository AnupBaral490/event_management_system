{% extends 'base.html' %}
{% block title %}Signed Out — EventSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div style="width:64px;height:64px;border-radius:50%;background:#f0fdf4;color:#059669;font-size:1.75rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
      <i class="bi bi-check-lg"></i>
    </div>
    <h4 style="margin-bottom:.5rem">You've been signed out</h4>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem">Thanks for using EventSphere. See you next time!</p>
    <a class="btn btn-primary-brand w-100" href="/accounts/login/" style="padding:.7rem">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Again
    </a>
    <a class="btn btn-outline-brand w-100 mt-2" href="/" style="padding:.65rem">Back to Home</a>
  </div>
</div>
{% endblock %}
