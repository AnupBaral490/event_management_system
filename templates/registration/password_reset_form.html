{% extends 'base.html' %}
{% block title %}Reset Password — EventSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:1.5rem;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
        <i class="bi bi-envelope-open"></i>
      </div>
      <h4 style="font-size:1.3rem;margin-bottom:.35rem">Reset your password</h4>
      <p style="color:var(--text-muted);font-size:.88rem;margin:0">We'll send a reset link to your email address.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}
      <button class="btn btn-primary-brand w-100" type="submit" style="padding:.7rem">
        <i class="bi bi-send me-2"></i>Send Reset Email
      </button>
    </form>
    <div class="text-center mt-3">
      <a href="/accounts/login/" style="font-size:.85rem;color:var(--text-muted)">
        <i class="bi bi-arrow-left me-1"></i>Back to login
      </a>
    </div>
  </div>
</div>
{% endblock %}
