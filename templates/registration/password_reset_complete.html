{% extends 'base.html' %}
{% block title %}Password Reset Complete — EventSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div style="width:64px;height:64px;border-radius:50%;background:#f0fdf4;color:#059669;font-size:1.75rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
      <i class="bi bi-shield-check"></i>
    </div>
    <h4 style="margin-bottom:.5rem">Password updated!</h4>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem">
      Your password has been successfully reset. You can now sign in with your new password.
    </p>
    <a href="/accounts/login/" class="btn btn-primary-brand w-100" style="padding:.7rem">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </a>
  </div>
</div>
{% endblock %}
