{% extends 'base.html' %}
{% block title %}Check Your Email — EventSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div style="width:64px;height:64px;border-radius:50%;background:#eff6ff;color:#3b82f6;font-size:1.75rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
      <i class="bi bi-envelope-check"></i>
    </div>
    <h4 style="margin-bottom:.5rem">Check your email</h4>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem">
      We've sent a password reset link to your email address. It may take a minute to arrive.
    </p>
    <a href="/accounts/login/" class="btn btn-outline-brand w-100">
      <i class="bi bi-arrow-left me-2"></i>Back to login
    </a>
  </div>
</div>
{% endblock %}
