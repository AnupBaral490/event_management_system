{% extends 'base.html' %}
{% block title %}Event Calendar{% endblock %}
{% block content %}
<div class="glass-card p-4 mb-3">
    <h2 class="mb-1">Event Calendar</h2>
    <p class="mb-0 text-secondary">View all upcoming events by date and click any item to open details.</p>
</div>
<div id="calendar" class="glass-card p-3"></div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        events: '/events/api/events/calendar/'
    });
    calendar.render();
});
</script>
{% endblock %}
