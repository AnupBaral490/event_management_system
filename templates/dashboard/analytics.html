{% extends 'base.html' %}
{% block title %}Analytics — EventSphere{% endblock %}
{% block content %}

<div class="page-header">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
            <span class="section-label">Insights</span>
            <h2 class="mb-0">Analytics Overview</h2>
        </div>
        <a href="/dashboard/" class="btn btn-outline-brand btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Dashboard
        </a>
    </div>
</div>

<!-- Summary KPIs (loaded via JS) -->
<div class="row g-3 mb-4" id="summaryCards">
    <div class="col-6 col-lg-3">
        <div class="kpi-card" style="min-height:110px;background:#f8fafc"></div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="kpi-card" style="min-height:110px;background:#f8fafc"></div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="kpi-card" style="min-height:110px;background:#f8fafc"></div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="kpi-card" style="min-height:110px;background:#f8fafc"></div>
    </div>
</div>

<!-- Chart -->
<div class="chart-card">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="chart-title mb-0">Booking &amp; Revenue Trend</h6>
        <span style="font-size:.78rem;color:var(--text-muted)">Last 30 days</span>
    </div>
    <canvas id="bookingTrendChart" height="120"></canvas>
</div>

{% endblock %}
{% block scripts %}
<script>
const STRIPE_COLORS = ['#4f46e5','#06b6d4','#10b981','#f59e0b'];
const STRIPE_BG = ['#eef2ff','#ecfeff','#f0fdf4','#fffbeb'];
const STRIPE_IC = ['bi-currency-rupee','bi-ticket-perforated-fill','bi-bag-check-fill','bi-person-fill'];
const LABELS = ['Revenue','Tickets','Bookings','Attendees'];
const KEYS = ['total_revenue','total_tickets','total_bookings','unique_attendees'];

async function loadAnalytics() {
    let data;
    try {
        const res = await fetch('/analytics/api/dashboard/');
        data = await res.json();
    } catch {
        document.getElementById('summaryCards').innerHTML = '<div class="col-12"><p class="text-danger">Failed to load analytics.</p></div>';
        return;
    }
    const totals = data.totals || {};

    document.getElementById('summaryCards').innerHTML = KEYS.map((k, i) => `
        <div class="col-6 col-lg-3">
          <div class="kpi-card">
            <div class="kpi-stripe" style="background:${STRIPE_COLORS[i]}"></div>
            <div class="kpi-icon" style="background:${STRIPE_BG[i]};color:${STRIPE_COLORS[i]}">
              <i class="bi ${STRIPE_IC[i]}"></i>
            </div>
            <div class="kpi-value">${(totals[k] || 0).toLocaleString()}</div>
            <div class="kpi-label">${LABELS[i]}</div>
          </div>
        </div>`).join('');

    const labels   = (data.trend || []).map(d => d.date);
    const bookings = (data.trend || []).map(d => d.bookings);
    const revenue  = (data.trend || []).map(d => d.revenue);

    const ctx = document.getElementById('bookingTrendChart').getContext('2d');
    const bookingGrad = ctx.createLinearGradient(0, 0, 0, 300);
    bookingGrad.addColorStop(0, 'rgba(79,70,229,.18)');
    bookingGrad.addColorStop(1, 'rgba(79,70,229,0)');
    const revenueGrad = ctx.createLinearGradient(0, 0, 0, 300);
    revenueGrad.addColorStop(0, 'rgba(245,158,11,.18)');
    revenueGrad.addColorStop(1, 'rgba(245,158,11,0)');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: 'Bookings',
                    data: bookings,
                    borderColor: '#4f46e5',
                    backgroundColor: bookingGrad,
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: '#4f46e5',
                    fill: true,
                    tension: 0.4,
                    yAxisID: 'y'
                },
                {
                    label: 'Revenue (INR)',
                    data: revenue,
                    borderColor: '#f59e0b',
                    backgroundColor: revenueGrad,
                    borderWidth: 2,
                    pointRadius: 3,
                    pointBackgroundColor: '#f59e0b',
                    fill: true,
                    tension: 0.4,
                    yAxisID: 'y1'
                }
            ]
        },
        options: {
            responsive: true,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    labels: {
                        usePointStyle: true,
                        font: { family: "'Sora', sans-serif", size: 12 }
                    }
                },
                tooltip: {
                    backgroundColor: '#fff',
                    titleColor: '#1e293b',
                    bodyColor: '#475569',
                    borderColor: '#e2e8f0',
                    borderWidth: 1,
                    padding: 12,
                    cornerRadius: 10,
                    boxShadow: '0 4px 16px rgba(0,0,0,.1)'
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { font: { size: 11 } } },
                y: {
                    position: 'left',
                    grid: { color: 'rgba(0,0,0,.04)' },
                    ticks: { font: { size: 11 } }
                },
                y1: {
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    ticks: { font: { size: 11 } }
                }
            }
        }
    });
}
loadAnalytics();
</script>
{% endblock %}
